<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 - MVC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="noise"></div>

    <div id="main-ui">
        <svg id="graph-container" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <defs>
                <filter id="deteriorate">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" />
                </filter>
            </defs>
            <!-- Capas del Grafo -->
            <g id="connections-layer"></g>
            <g id="nodes-layer"></g>
        </svg>
    </div>

    <!-- Pantalla de Transición -->
    <div id="transition-screen">
        <div id="transition-text">ESTADO_SISTEMA: CARGANDO...</div>
        <button class="btn-volver" id="btn-volver">Volver al Sistema</button>
    </div>

    <!-- Carga de Scripts en Orden MVC -->
    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
</body>
</html>
